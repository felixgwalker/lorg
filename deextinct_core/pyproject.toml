[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deextinct-core"
version = "0.1.0"
description = "Shared aDNA-aware data model for the de-extinction toolkit"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["deextinct_core*"]
