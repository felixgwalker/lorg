[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hgt-risk-assessor"
version = "0.1.0"
requires-python = ">=3.10"
description = "Sequence-level HGT risk scoring for engineered organisms"
dependencies = [
    "biopython>=1.81",
    "requests>=2.31",
]

[project.optional-dependencies]
vcf = ["pyvcf3>=1.0.3"]

[project.scripts]
hgt-risk-assessor = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
